name: Node.js CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        uses: reviewdog/action-eslint@v1.33.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          reporter: github-pr-review
          eslint_flags: "."

      - name: Run build
        run: npm run build # 型エラー、importミス、Next.jsの設定ミスなどが無いことを確認

  danger:
    needs: build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions: write-all
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Danger
        uses: danger/danger-js@13.0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN}}
          DANGER_DISABLE_TRANSPILATION: true #エラー回避、githubのissueに掲載されている
